upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # API v1 routes — pass full path (FastAPI has routes at /api/v1/*)
    location /api/v1/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # API docs — pass full path
    location ~ ^/api/(docs|redoc|openapi\.json) {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # Legacy API routes — strip /api prefix (FastAPI routes are at /dashboard, /scan, etc.)
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Health check
    location = /health {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # Auth routes (no /api prefix needed — same backend)
    location /auth/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OpenAPI docs
    location ~ ^/(docs|openapi.json|redoc) {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # Frontend SPA — serve static files, fall back to index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Frontend assets with long-term caching
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
