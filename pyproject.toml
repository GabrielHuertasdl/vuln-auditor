[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnerability-detector"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic>=0.28",
    "google-generativeai>=0.5",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.9",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9",
    "arq>=0.26.0",
    "reportlab>=4.0",
    "email-validator>=2.0",
    "starlette[full]>=0.37",  # Session middleware for OIDC state
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]
sso = [
    "authlib>=1.3",
]
billing = [
    "stripe>=8.0",
]
storage-s3 = [
    "boto3>=1.34",
]
all-enterprise = [
    "authlib>=1.3",
    "stripe>=8.0",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*", "core*", "ai*", "reports*", "api*", "db*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
